[project]
name = "autopost"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "discord-py>=2.3.0",
    "openai>=1.54.0,<2.0.0",
    "python-dotenv==1.0.0",
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]

select = ["E", "F", "I", "B", "C4", "UP", "SIM", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Texto de prompts para GPT-4, no código — no tiene sentido cortar líneas ahí.
"prompt_config.py" = ["E501"]
